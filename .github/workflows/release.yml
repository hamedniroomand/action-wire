name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/action-wire/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Token-less publishing through npm Trusted Publishing (OIDC). The
      # package settings on npmjs.com must list this repository and this
      # workflow file as a trusted publisher; no NPM_TOKEN secret is used.
      # OIDC publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
        working-directory: packages/action-wire
