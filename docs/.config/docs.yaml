# yaml-language-server: $schema=https://unpkg.com/undocs/schema/config.json

name: Action Wire
shortDescription: A chat assistant that drives your app through its own tools
description: >-
  Action Wire adds a text assistant to a web application. The assistant reads
  the WebMCP tools the application already registers, and calls them. The
  application keeps one definition of each tool.

themeColor: violet
lang: en

github: hamedniroomand/action-wire

# `url` is required for a production build. Change it if the site is deployed
# somewhere other than GitHub Pages.
url: https://hamedniroomand.github.io/action-wire

landing:
  heroTitle: One set of tools. Two ways to use them.
  heroDescription: >-
    Your application registers its actions once with WebMCP. People click them.
    The assistant calls the same handlers, with the same permissions, and asks
    before anything destructive.
  heroCode:
    lang: ts
    title: app.ts
    content: |
      import { openAICompatible } from 'action-wire'
      import { createAssistant } from 'action-wire'

      createAssistant({
        model: openAICompatible({ endpoint: '/api/assistant' }),
      }).mount()
  heroLinks:
    quickstart:
      label: Quickstart
      icon: i-lucide-rocket
      to: /guide/quickstart
  featuresTitle: What you get
  features:
    - title: No second copy of your tools
      description: >-
        The assistant discovers the schemas and handlers the page already
        registered. You do not write them again for the model, and the two
        cannot drift apart.
      icon: i-lucide-copy-slash
    - title: The browser decides, not the model
      description: >-
        Model output is a request. Destructive tools need explicit approval,
        approval expires when the tool list changes, and your application
        authorization still applies.
      icon: i-lucide-shield-check
    - title: Any framework, or none
      description: >-
        The widget is a Web Component with no framework dependency. Vanilla
        JavaScript, React, Vue, and Svelte examples run against the same build.
      icon: i-lucide-boxes
    - title: Bring your own interface
      description: >-
        The headless bridge exposes state and methods without any UI. Render
        the transcript, the tool cards, and the confirmations yourself.
      icon: i-lucide-terminal
  contributors: true
